command_timeout = 3600
add_newline = true

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
c\
$cmake\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$gleam\
$golang\
$haskell\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$openstack\
$azure\
$nats\
$direnv\
$env_var\
$fill \
$cmd_duration $jobs $time\
$crystal\
$custom\
$sudo\
$battery\
$status\
$container\
$shell\
$line_break\
$character\
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
#success_symbol = '[➜](bold green)'
#error_symbol = '[➜](bold red)'
vimcmd_symbol = "[◎](bold blue)"
vimcmd_replace_symbol = "[◎](bold fg:purple)"
vimcmd_replace_one_symbol = "[◎](bold fg:purple)"

[fill]
symbol = " "

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = " "
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
#style_user = "bg:surface0 fg:text"
#style_root = "bg:surface0 fg:text"
format = '[$user ]($style)'

[directory]
format = "[$path ]($style)"
truncation_length = 4

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[os]
disabled = true
format = "$symbol"
#style = "bg:surface0 fg:text"

[custom.giturl]
disabled = true
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL="  "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL"
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
style = "fg:white"
format = "[$output ]($style) "

[git_branch]
symbol = " "
style = "fg:purple bold"
format = 'on [$symbol$branch]($style)'

[git_status]
format = "[$untracked$staged$modified$renamed$deleted$conflicted$ahead_behind]($style)"
# options available for format

staged     = "[ ${count} ](green)"
modified   = "[ ${count} ](yellow)"
renamed    = "[ ${count} ](blue)"
deleted    = "[ ${count} ](red)"
untracked  = "[ ${count} ](green)"
stashed    = "[ ${count} ](purple)"
conflicted = "[ ${count} ](cyan bold)"

ahead    = "[ ${count} ](cyan)"
behind   = "[ ${count} ](purple)"
diverged = "[ ${ahead_count}  ${behind_count} ](purple)"

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
      common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
      git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
      if [ "$common_dir" != "$git_dir" ]; then
            echo "⛓ "
      fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = " ([$output ]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true

[nodejs]
symbol = ""
format = 'via[ $symbol( $version)]($style)'

[c]
symbol = " "
style = "blue"
format = 'via[ $symbol( $version) ]($style)'

[rust]
symbol = ""
format = 'via[[ $symbol( $version) ]]($style)'

[golang]
symbol = ""
style = "bold sapphire"
format = 'via[ $symbol( $version) ]($style)'
detect_files = ["go.mod"]

[php]
symbol = ""
format = 'via[[ $symbol( $version) ]]($style)'

[java]
symbol = " "
format = 'via[[ $symbol( $version) ]]($style)'

[kotlin]
symbol = ""

format = 'via[[ $symbol( $version) ]]($style)'

[haskell]
symbol = ""
format = 'via[[ $symbol( $version) ]]($style)'

[python]
symbol = " "
style = "bold yellow"
format = 'via[ $symbol( $version) ]($style)'

[docker_context]
symbol = "🐳"
format = ' on[ $symbol( $context) ]($style)'

[time]
disabled = true
time_format = "%R"
format = "[[  $time ](fg:yellow bg:foam)]($style)"

[line_break]
disabled = false

[aws]
disabled=true
